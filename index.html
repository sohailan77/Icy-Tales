<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        content="Icy Tales is an ice cream website featuring delicious flavors, creamy treats, special offers, and sweet moments for every ice cream lover.">
    <title>Icy-Tales</title>
    <link rel="stylesheet" href="style.css">

            </div>

                    <li><a href="#">Home</a></li>
